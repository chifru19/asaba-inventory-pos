<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Receipt</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; display: flex; justify-content: center; }
        .receipt-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #006644; margin-bottom: 20px; }
        .receipt-info { margin-bottom: 20px; font-size: 14px; color: #555; }
        .total-row { font-size: 18px; font-weight: bold; margin-top: 20px; border-top: 2px solid #ddd; padding-top: 10px; display: flex; justify-content: space-between; }
        .btn { display: block; text-align: center; background-color: #006644; color: white; padding: 10px; text-decoration: none; border-radius: 4px; margin-top: 20px; }
        .btn:hover { background-color: #004d33; }
    </style>
</head>
<body>
    <div class="receipt-card">
        <h2>Asaba Store Receipt</h2>
        <div class="receipt-info">
            <div><strong>Receipt #:</strong> ASABA-{{ sale.id }}</div>
            <div><strong>Date:</strong> {{ sale.timestamp.strftime('%Y-%m-%d %H:%M:%S') if sale.timestamp else '' }}</div>
        </div>

        <div class="total-row">
            <span>Total Paid:</span>
            <span>CFA {{ "%.2f"|format(sale.total_amount) }}</span>
        </div>

        <a href="/" class="btn">← New Sale / Return to Register</a>
    </div>
</body>
</html>
