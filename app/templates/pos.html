<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS Terminal - {{ store_id.upper() }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">POS Terminal (Store: {{ store_id.upper() }})</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h4>Products</h4>
                <div class="row">
                    {% for p in products %}
                    <div class="col-md-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">{{ p.name }}</h5>
                                <p class="card-text">Price: ₦{{ p.price }}<br>Stock: <span id="stock-{{ p.id }}">{{ p.stock }}</span></p>
                                <button class="btn btn-success btn-sm" onclick="addToCart('{{ p.id }}', '{{ p.name }}', {{ p.price }})">Add to Sale</button>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h4>Current Sale</h4>
                        <ul id="cart-list" class="list-group mb-3"></ul>
                        <h5>Total: ₦<span id="cart-total">0</span></h5>
                        <button class="btn btn-primary w-100" onclick="checkout()">Complete Sale</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let cart = [];
        function addToCart(id, name, price) {
            let item = cart.find(i => i.product_id === id);
            if (item) { item.quantity++; } 
            else { cart.push({ product_id: id, name, price, quantity: 1 }); }
            renderCart();
        }
        function renderCart() {
            let list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0;
            cart.forEach(i => {
                total += i.price * i.quantity;
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">${i.name} x ${i.quantity} <span>₦${i.price * i.quantity}</span></li>`;
            });
            document.getElementById('cart-total').textContent = total;
        }
        async function checkout() {
            if (cart.length === 0) return alert('Cart is empty');
            let res = await fetch('/api/sell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart })
            });
            let data = await res.json();
            if (res.ok) {
                alert('Sale successful! Total: ₦' + data.total_amount);
                location.reload();
            } else {
                alert(data.error);
            }
        }
    </script>
</body>
</html>
