{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">🛒 Sales Register</h2>
<p class="text-muted">Record items sold. Stock updates automatically upon checkout.</p>
<form method="POST" action="{{ url_for('pos_checkout') }}">
    <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Qty Sold</th>
                </tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td>
                        <strong>{{ p.name }}</strong><br>
                        <small class="text-muted">{{ p.sku }}</small>
                        <input type="hidden" name="product_id[]" value="{{ p.id }}">
                    </td>
                    <td>{{ "%.2f"|format(p.selling_price) }}</td>
                    <td><span class="badge bg-secondary">{{ p.stock_quantity }}</span></td>
                    <td>
                        <input type="number" name="quantity[]" value="0" min="0" max="{{ p.stock_quantity }}" class="form-control form-control-sm" style="width: 75px;">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100 shadow mt-2">Complete Sale & Update Stock</button>
</form>
{% endblock %}
